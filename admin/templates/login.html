<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід — Я хочу бот</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#12131a; color:#e4e6eb;
         font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { background:#191b23; border:1px solid #272a35; border-radius:8px;
         padding:26px; width:300px; }
  h1 { font-size:16px; font-weight:600; margin:0 0 18px; }
  input, button { font:inherit; width:100%; border-radius:6px; padding:9px 11px;
                  border:1px solid #272a35; background:#10121a; color:#e4e6eb; }
  button { margin-top:12px; background:#7aa2f7; color:#0d1017; border-color:#7aa2f7;
           font-weight:600; cursor:pointer; }
  .err { color:#f07178; font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<form method="post">
  <h1>Я хочу бот</h1>
  <input type="password" name="password" placeholder="Пароль" autofocus required>
  <button type="submit">Увійти</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
